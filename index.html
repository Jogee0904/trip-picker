<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Picker</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(to bottom right, #f3f4f6, #e0f7fa);
      text-align: center;
      padding: 2rem;
      color: #333;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    button {
      width: 90%;
      max-width: 400px;
      padding: 1rem;
      margin: 0.7rem auto;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      background-color: #3b82f6;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: background 0.3s ease;
      display: block;
    }
    button:hover {
      background-color: #2563eb;
    }
    #result {
      margin-top: 2rem;
      font-size: 1.2rem;
      padding: 1rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      white-space: pre-line;
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <h1>📍 Trip Picker</h1>
  <button onclick="addPlace()">➕ 新增地點</button>
  <button onclick="drawPlace()">🎯 抽出地點</button>
  <button onclick="showList()">📋 剩餘地點</button>
  <div id="result"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzA4K984Z2QmNBhF9JJZrHSypK3sNRYLjioCNioxybHrZ0W2KlBy0XLKVjNqq2cwfII/exec';

    async function init() {
      await liff.init({ liffId: '2007354842-mklpBqzE' });
      if (!liff.isLoggedIn()) liff.login();
    }

    async function addPlace() {
      const place = prompt("請輸入想新增的地點：");
      if (!place) return;
      const profile = await liff.getProfile();
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', place, user: profile.displayName })
      });
      const result = await res.json();
      document.getElementById('result').innerText =
        result.status === 'added' ? `✅ 已新增「${place}」` : `⚠️ 地點「${place}」已存在！`;
    }

    async function drawPlace() {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'draw' })
      });
      const result = await res.json();
      if (result.status === 'picked') {
        document.getElementById('result').innerText = `🎯 抽中的地點是：\n${result.place}`;
        liff.shareTargetPicker([{ type: 'text', text: `🎯 我們抽中了：${result.place}` }]);
      } else {
        document.getElementById('result').innerText = '📭 地點清單為空';
      }
    }

    async function showList() {
      const res = await fetch(API_URL);
      const list = await res.json();
      if (list.length === 0) {
        document.getElementById('result').innerText = '✅ 所有地點都已抽完！';
      } else {
        const names = list.map(row => row[0]).join('\n');
        document.getElementById('result').innerText = `📋 剩餘地點如下：\n${names}`;
      }
    }

    init();
  </script>
</body>
</html>
