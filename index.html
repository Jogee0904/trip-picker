<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Picker</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Fredoka', sans-serif;
      background: #ffffff;
      color: #333;
      padding: 1.5rem;
      margin: 0;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    .hero-img {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      margin-bottom: 1.5rem;
      border-radius: 18px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      padding: 1rem;
      margin: 0.7rem 0;
      font-size: 1.1rem;
      border: none;
      border-radius: 14px;
      background-color: #e6c110;
      color: #222;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #fddc3a;
    }
    #result {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      background: #ffffff;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      white-space: pre-line;
    }
  </style>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="container">
    <img class="hero-img" src="./tripcat.png" alt="trip cat illustration">
    <h1>🐾 Trip Picker</h1>
    <button onclick="addPlace()">➕ 新增地點</button>
    <button onclick="drawPlace()">🎯 抽出地點</button>
    <button onclick="showList()">📋 備選地點</button>
    <div id="result"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzA4K984Z2QmNBhF9JJZrHSypK3sNRYLjioCNioxybHrZ0W2KlBy0XLKVjNqq2cwfII/exec';

    async function init() {
      await liff.init({ liffId: '2007354842-mklpBqzE' });
      if (!liff.isLoggedIn()) liff.login();
    }

    async function addPlace() {
      const place = prompt("請輸入想新增的地點：");
      if (!place) return;
      const profile = await liff.getProfile();
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', place, user: profile.displayName })
      });
      const result = await res.json();
      document.getElementById('result').innerText =
        result.status === 'added' ? `✅ 已新增「${place}」` : `⚠️ 地點「${place}」已存在！`;
    }

    async function drawPlace() {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'draw' })
      });
      const result = await res.json();
      if (result.status === 'picked') {
        document.getElementById('result').innerText = `🎯 抽中的地點是：\n${result.place}`;
        liff.shareTargetPicker([{ type: 'text', text: `🎯 我們抽中了：${result.place}` }]);
      } else {
        document.getElementById('result').innerText = '📭 備選地點已清空';
      }
    }

    async function showList() {
      const res = await fetch(API_URL);
      const list = await res.json();
      if (list.length === 0) {
        document.getElementById('result').innerText = '✅ 所有地點都已抽完！';
      } else {
        const names = list.map(row => row[0]).join('\n');
        document.getElementById('result').innerText = `📋 備選地點如下：\n${names}`;
      }
    }

    init();
  </script>
</body>
</html>
